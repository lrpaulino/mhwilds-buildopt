[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mh-wilds-build-optimizer"
version = "0.1.0"
description = "Otimizador de builds para Monster Hunter Wilds (FastAPI + CVXPY)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Lucas R. Paulino", email = "lucasrangel2@hotmail.com" },
]
keywords = [
    "monster-hunter",
    "wilds",
    "build",
    "optimizer",
    "cvxpy",
    "fastapi",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Games/Entertainment",
]

dependencies = [
    "fastapi[standard]==0.141.1",
    "uvicorn[standard]==0.52.4",
    "httpx==0.28.1",
    "cvxpy==1.9.2",
    "numpy==2.5.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6.0",
    "mypy>=1.11",
]

[project.urls]
Homepage = "https://github.com/seu-usuario/mh-wilds-build-optimizer"
Repository = "https://github.com/seu-usuario/mh-wilds-build-optimizer"
Issues = "https://github.com/seu-usuario/mh-wilds-build-optimizer/issues"

[tool.setuptools]
packages = ["backend"]
include-package-data = false

# ---------------------------------------------------------------------------
# Ruff — linter/formatter
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py310"
src = ["backend"]
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "data",
    "frontend",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long
]

[tool.ruff.lint.isort]
known-first-party = ["backend"]

# ---------------------------------------------------------------------------
# MyPy — checagem de tipos
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false
exclude = [
    "^data/",
    "^frontend/",
]

# ---------------------------------------------------------------------------
# Pytest — testes
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra -q"
asyncio_mode = "auto"
